name: crypto

# Crypto Up/Down closing-minutes strategy. Each job loops for about 5h45m; the
# hourly schedule queues the next job so coverage is close to continuous.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: polyedge-crypto
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
      POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
      POLYEDGE_MODE: ${{ vars.POLYEDGE_CRYPTO_MODE || vars.POLYEDGE_MODE || 'paper' }}
      POLYEDGE_KILL: ${{ vars.POLYEDGE_KILL }}
      POLYEDGE_MAX_TOTAL_USD: ${{ vars.POLYEDGE_MAX_TOTAL_USD }}
      POLYEDGE_MAX_DAILY_LOSS_USD: ${{ vars.POLYEDGE_MAX_DAILY_LOSS_USD }}
      POLYEDGE_MAX_WEEKLY_LOSS_USD: ${{ vars.POLYEDGE_MAX_WEEKLY_LOSS_USD }}
      POLYEDGE_CRYPTO_ASSETS: ${{ vars.POLYEDGE_CRYPTO_ASSETS }}
      POLYEDGE_CRYPTO_HORIZONS: ${{ vars.POLYEDGE_CRYPTO_HORIZONS }}
      POLYEDGE_CRYPTO_MIN_PRICE: ${{ vars.POLYEDGE_CRYPTO_MIN_PRICE }}
      POLYEDGE_CRYPTO_MAX_PRICE: ${{ vars.POLYEDGE_CRYPTO_MAX_PRICE }}
      POLYEDGE_CRYPTO_WINDOW_SECS: ${{ vars.POLYEDGE_CRYPTO_WINDOW_SECS }}
      POLYEDGE_CRYPTO_MIN_FAIR: ${{ vars.POLYEDGE_CRYPTO_MIN_FAIR }}
      POLYEDGE_CRYPTO_REST_SECS: ${{ vars.POLYEDGE_CRYPTO_REST_SECS }}
      POLYEDGE_CRYPTO_MIN_FAIR_EDGE: ${{ vars.POLYEDGE_CRYPTO_MIN_FAIR_EDGE }}
      POLYEDGE_CRYPTO_MAX_ORDER_USD: ${{ vars.POLYEDGE_CRYPTO_MAX_ORDER_USD }}
      POLYEDGE_CRYPTO_SURE_ORDER_USD: ${{ vars.POLYEDGE_CRYPTO_SURE_ORDER_USD }}
      POLYEDGE_CRYPTO_LOSS_SINCE: ${{ vars.POLYEDGE_CRYPTO_LOSS_SINCE }}
      POLYEDGE_CRYPTO_RUN_MINUTES: ${{ vars.POLYEDGE_CRYPTO_RUN_MINUTES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trade, saving state every 10 minutes
        run: |
          git config user.name "polyedge-bot"
          git config user.email "polyedge-bot@users.noreply.github.com"
          save() {
            python -m polyedge crypto-report > state/crypto/report.md || true
            git add state/crypto
            git diff --cached --quiet || git commit -q -m "state: crypto run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q && break; sleep 5; done
          }
          # A queued run checks out the commit from when it was queued; catch up on the
          # state the previous run saved since, or every save here would conflict.
          git pull -q --rebase origin main
          python -u -m polyedge crypto & pid=$!
          while kill -0 $pid 2>/dev/null; do
            for _ in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 10; done
            save || true
          done
          wait $pid; status=$?
          save
          exit $status
