name: trade

on:
  schedule:
    # Every 2 hours (GitHub may start scheduled runs a few minutes late).
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: polyedge-trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
      POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
      # Stays "paper" until you set the POLYEDGE_MODE repository variable to "live".
      POLYEDGE_MODE: ${{ vars.POLYEDGE_MODE || 'paper' }}
      POLYEDGE_CATEGORIES: ${{ vars.POLYEDGE_CATEGORIES }}
      POLYEDGE_MAX_ORDER_USD: ${{ vars.POLYEDGE_MAX_ORDER_USD }}
      POLYEDGE_MAX_MARKET_USD: ${{ vars.POLYEDGE_MAX_MARKET_USD }}
      POLYEDGE_MAX_TOTAL_USD: ${{ vars.POLYEDGE_MAX_TOTAL_USD }}
      POLYEDGE_MAX_DAILY_LOSS_USD: ${{ vars.POLYEDGE_MAX_DAILY_LOSS_USD }}
      POLYEDGE_KILL: ${{ vars.POLYEDGE_KILL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m polyedge run
      - run: python -m polyedge status
      - name: Save state
        if: always()
        run: |
          git config user.name "polyedge-bot"
          git config user.email "polyedge-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "state: run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main && git push
