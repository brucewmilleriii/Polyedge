name: live-check

# Read-only: confirms the Polymarket US keys work and previews (never places)
# 1-contract YES and NO orders. Run by hand from the Actions tab.
on:
  workflow_dispatch:

concurrency:
  group: polyedge-trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
      POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m polyedge.live_check
      - name: Save result
        run: |
          git config user.name "polyedge-bot"
          git config user.email "polyedge-bot@users.noreply.github.com"
          git add state/live_check.json
          git diff --cached --quiet || git commit -m "state: live check [skip ci]"
          git pull --rebase origin main && git push
